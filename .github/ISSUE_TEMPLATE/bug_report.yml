name: Bug report
description: Report a reproducible problem without private data or exploit details
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and operating system
  - type: markdown
    attributes:
      value: "For vulnerabilities, use SECURITY.md. Remove secrets and personal data from reports."

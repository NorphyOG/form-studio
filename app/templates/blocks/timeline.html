{% from 'blocks/shared.html' import heading %}<section class="section timeline-section" id="{{ block.id }}">{{ heading(block) }}<ol class="story-timeline">{% for item in block['items'] %}<li><span class="timeline-value">{{ item.value or '%02d'|format(loop.index) }}</span><span class="timeline-node" aria-hidden="true"></span><div><h3>{{ item.title }}</h3><p>{{ item.text }}</p></div></li>{% endfor %}</ol></section>

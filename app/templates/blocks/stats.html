{% from 'blocks/shared.html' import heading %}
<section class="section stats-section" id="{{ block.id }}">{{ heading(block) }}<div class="module-grid">{% for item in block['items'] %}<div class="metric-tile"><span class="metric-value">{{ item.value }}</span><h3>{{ item.title }}</h3><p>{{ item.text }}</p></div>{% endfor %}</div></section>

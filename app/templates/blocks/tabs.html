{% from 'blocks/shared.html' import heading,picture,link %}<section class="section tabs-section" id="{{ block.id }}">{{ heading(block) }}<div class="topic-tabs" data-tabs><div class="topic-buttons" hidden role="tablist" aria-label="{{ block.title or 'Themen' }}">{% for item in block['items'] %}<button type="button" role="tab" id="{{ block.id }}-tab-{{ loop.index }}" aria-controls="{{ block.id }}-panel-{{ loop.index }}" aria-selected="{{ 'true' if loop.first else 'false' }}" tabindex="{{ '0' if loop.first else '-1' }}">{{ item.title }} <span aria-hidden="true">↗</span></button>{% endfor %}</div><div class="topic-panels">{% for item in block['items'] %}<section class="topic-panel" id="{{ block.id }}-panel-{{ loop.index }}" aria-labelledby="{{ block.id }}-tab-{{ loop.index }}"><div><span class="micro">{{ '%02d'|format(loop.index) }} / PERSPEKTIVE</span><h3>{{ item.title }}</h3><p>{{ item.text }}</p>{{ link(item) }}</div><div class="topic-art">{{ picture(item,media) }}</div></section>{% endfor %}</div></div></section>

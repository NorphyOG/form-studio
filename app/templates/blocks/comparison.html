{% from 'blocks/shared.html' import heading,picture %}<section class="section comparison-section" id="{{ block.id }}">{{ heading(block) }}{% if block['items']|length >= 2 %}<div class="comparison" data-comparison><div class="comparison-canvas"><figure class="comparison-base">{{ picture(block['items'][0],media) }}<figcaption>{{ block['items'][0].title }}</figcaption></figure><figure class="comparison-overlay">{{ picture(block['items'][1],media) }}<figcaption>{{ block['items'][1].title }}</figcaption></figure><div class="comparison-handle" aria-hidden="true"><span>↔</span></div></div><label class="comparison-control">{{ block['items'][0].title }}<input type="range" min="0" max="100" value="50" aria-label="Bildvergleich: Anteil Nachher" aria-valuetext="50 Prozent Nachher"><span>{{ block['items'][1].title }}</span></label></div>{% elif preview %}<p class="module-empty">Für den Vergleich bitte zwei Einträge anlegen.</p>{% endif %}</section>

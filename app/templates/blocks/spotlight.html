{% from 'blocks/shared.html' import picture,link %}<section class="section spotlight-section" id="{{ block.id }}"><span class="micro section-kicker">{{ block.eyebrow }}</span><div class="spotlight-grid"><div class="spotlight-copy"><h2>{{ block.title }}</h2><p>{{ block.text }}</p>{{ link(block) }}</div><div class="spotlight-visual">{{ picture(block,media) }}<span class="spotlight-coordinate micro" aria-hidden="true">FORM / {{ '%02d'|format(loop.index if loop else 1) }}</span></div></div></section>

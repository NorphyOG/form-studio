<section class="section process-section" id="{{ block.id }}"><div class="section-heading"><div><span class="micro section-kicker">{{ block.eyebrow }}</span><h2>{{ block.title }}</h2></div><p>{{ block.text }}</p></div><div class="process-grid">{% for item in block['items'] %}<article class="process-item"><span class="process-number">0{{ loop.index }}</span><h3>{{ item.title }}</h3><p>{{ item.text }}</p></article>{% endfor %}</div></section>
